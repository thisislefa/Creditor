<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategis Design</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* --- 1. RESET & VARIABLES --- */
        :root {
            --font-primary: 'Inter', sans-serif;
            --color-black: #050505; /* Deep rich black */
            --color-white: #ffffff;
            --color-gray-text: #a1a1a1;
            --radius-card: 24px;
            --spacing-card: 32px;
            --gap-grid: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-primary);
            background-color: #f4f4f4; /* Light gray bg to make the component pop */
            color: var(--color-black);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        /* --- 2. COMPONENT STRUCTURE --- */
        .strategis-section {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .showcase-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--gap-grid);
            height: 600px; /* Fixed height for desktop alignment */
        }

        /* Common Card Styles */
        .showcase-card {
            border-radius: var(--radius-card);
            overflow: hidden;
            position: relative;
            height: 100%;
            width: 100%;
        }

        /* --- 3. LEFT CARD (Content) --- */
        .card-content {
            background-color: var(--color-black);
            color: var(--color-white);
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .quote-block h2 {
            font-size: 32px;
            font-weight: 500;
            line-height: 1.3;
            letter-spacing: -0.02em;
        }

        .author-block {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .author-avatar {
            width: 48px;
            height: 48px;
            border-radius: 12px; /* Rounded square style from screenshot */
            object-fit: cover;
            background-color: #333;
        }

        .author-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .author-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-white);
        }

        .author-title {
            font-size: 14px;
            font-weight: 400;
            color: var(--color-gray-text);
        }

        /* --- 4. MIDDLE CARD (Image) --- */
        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* --- 5. RIGHT CARD (Video) --- */
        .card-video {
            background-color: #000;
            position: relative;
        }

        .card-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0.9; /* Slight dim for text readability if needed */
        }

        /* "See in action" Button Overlay */
        .video-action-btn {
            position: absolute;
            top: 32px;
            right: 32px;
            background: rgba(0, 0, 0, 0.3); /* Semi-transparent dark */
            backdrop-filter: blur(10px); /* The blur effect */
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--color-white);
            font-size: 14px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 2;
            cursor: default; /* No pointer because "no function buttons" requested */
        }

        .video-action-btn i {
            font-size: 16px;
            fill: var(--color-white);
        }

        /* --- 6. RESPONSIVE DESIGN --- */
        @media (max-width: 1024px) {
            .showcase-grid {
                grid-template-columns: 1fr;
                height: auto; /* Let content dictate height on mobile */
                gap: 24px;
            }

            .showcase-card {
                min-height: 400px; /* Ensure visual cards have height */
            }

            /* Adjust text size for mobile */
            .quote-block h2 {
                font-size: 28px;
            }
            
            /* Fix image aspect ratios on mobile */
            .card-content { min-height: auto; }
        }
    </style>
</head>
<body>

    <section class="strategis-section">
        <div class="showcase-grid">
            
            <!-- 1. Content Card -->
            <div class="showcase-card card-content">
                <div class="quote-block">
                    <h2>At Strategis, we don’t just advise—we help ambitious teams move faster with confidence</h2>
                </div>
                
                <div class="author-block">
                    <!-- Placeholder for Alex Tran -->
                    <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80" alt="Alex Tran" class="author-avatar">
                    <div class="author-info">
                        <span class="author-name">Alex Tran</span>
                        <span class="author-title">Founder & CEO</span>
                    </div>
                </div>
            </div>

            <!-- 2. Image Card -->
            <div class="showcase-card card-image">
                <!-- Portrait of woman similar to screenshot -->
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80" alt="Team Member">
            </div>

            <!-- 3. Video Card -->
            <div class="showcase-card card-video">
                <div class="video-action-btn">
                    <i class="ph-fill ph-play"></i>
                    See in action
                </div>
                <!-- 
                    Muted, Autoplay, Loop, Playsinline (for iOS)
                    No 'controls' attribute adds no function buttons.
                    Pointer-events none ensures no clicking/pausing.
                -->
                <video autoplay muted loop playsinline style="pointer-events: none;">
                    <!-- Using a high-quality abstract liquid/ink video placeholder -->
                    <source src="https://www.pexels.com/download/video/10994877/" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>

        </div>
    </section>

</body>
</html>
